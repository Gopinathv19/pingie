<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Pingie architecture: visitors, support team and staff use the widget, dashboard and admin console, which call ping-backend; the backend uses Memora, Nemotron on Nebius, PostgreSQL and Google Sign-In">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8AA0"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .s { font-size: 12px; fill: #A0A0B4; }
    .h { font-size: 11px; font-weight: 700; fill: #A78BFA; letter-spacing: 1.5px; }
    .box { fill: #15151F; stroke: #2E2E40; }
    .ext { fill: #111118; stroke: #3A3A4C; stroke-dasharray: 5 4; }
    .e { stroke: #8A8AA0; stroke-width: 1.6; fill: none; }
  </style>

  <rect width="1200" height="460" rx="20" fill="#0B0B12"/>
  <text x="40" y="44" font-size="13" font-weight="600" letter-spacing="2.5" fill="#A78BFA">ARCHITECTURE</text>

  <!-- column headings -->
  <text x="40" y="82" class="h">PEOPLE</text>
  <text x="250" y="82" class="h">APPS</text>
  <text x="520" y="82" class="h">PINGIE API</text>
  <text x="860" y="82" class="h">SERVICES</text>

  <!-- people -->
  <g transform="translate(40 100)"><rect width="170" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Website visitor</text><text x="16" y="48" class="s">anonymous</text></g>
  <g transform="translate(40 200)"><rect width="170" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Support team</text><text x="16" y="48" class="s">owner · editor · viewer</text></g>
  <g transform="translate(40 300)"><rect width="170" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Pingie staff</text><text x="16" y="48" class="s">allow-listed admins</text></g>

  <!-- apps -->
  <g transform="translate(250 100)"><rect width="210" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Chat widget</text><text x="16" y="48" class="s">widget.js · Shadow DOM</text></g>
  <g transform="translate(250 200)"><rect width="210" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Dashboard</text><text x="16" y="48" class="s">Next.js · React</text></g>
  <g transform="translate(250 300)"><rect width="210" height="64" rx="10" class="box"/><text x="16" y="28" class="t">Admin console</text><text x="16" y="48" class="s">Next.js</text></g>

  <!-- backend -->
  <g transform="translate(520 100)">
    <rect width="280" height="264" rx="12" fill="#1C1433" stroke="#7C3AED"/>
    <text x="20" y="34" class="t" style="font-size:17px">ping-backend</text>
    <text x="20" y="54" class="s">FastAPI · Python 3.12</text>
    <g transform="translate(20 76)">
      <rect width="240" height="36" rx="7" fill="#15151F" stroke="#2E2E40"/><text x="14" y="23" class="s" style="fill:#E6E6EE">Answer pipeline · grounding · citations</text>
    </g>
    <g transform="translate(20 122)">
      <rect width="240" height="36" rx="7" fill="#15151F" stroke="#2E2E40"/><text x="14" y="23" class="s" style="fill:#E6E6EE">Knowledge · team answers · memory</text>
    </g>
    <g transform="translate(20 168)">
      <rect width="240" height="36" rx="7" fill="#15151F" stroke="#2E2E40"/><text x="14" y="23" class="s" style="fill:#E6E6EE">Inbox · live chat · handoff</text>
    </g>
    <g transform="translate(20 214)">
      <rect width="240" height="36" rx="7" fill="#15151F" stroke="#2E2E40"/><text x="14" y="23" class="s" style="fill:#E6E6EE">Workspaces · roles · access checks</text>
    </g>
  </g>

  <!-- services -->
  <g transform="translate(860 96)"><rect width="300" height="64" rx="10" fill="#132016" stroke="#76B900"/><text x="16" y="28" class="t">NVIDIA Nemotron 3 Super</text><text x="16" y="48" class="s">on Nebius Token Factory · streamed</text></g>
  <g transform="translate(860 176)"><rect width="300" height="56" rx="10" class="ext"/><text x="16" y="25" class="t">Memora</text><text x="16" y="44" class="s">retrieval: embed · search · rerank</text></g>
  <g transform="translate(860 248)"><rect width="300" height="56" rx="10" class="ext"/><text x="16" y="25" class="t">PostgreSQL</text><text x="16" y="44" class="s">bots · chats · messages · leads</text></g>
  <g transform="translate(860 320)"><rect width="300" height="56" rx="10" class="ext"/><text x="16" y="25" class="t">Google Sign-In</text><text x="16" y="44" class="s">dashboard and admin login</text></g>

  <!-- edges: people -> apps -->
  <path d="M210 132 H248" class="e" marker-end="url(#a)"/>
  <path d="M210 232 H248" class="e" marker-end="url(#a)"/>
  <path d="M210 332 H248" class="e" marker-end="url(#a)"/>
  <!-- apps -> backend -->
  <path d="M460 132 H518" class="e" marker-end="url(#a)"/>
  <path d="M460 232 H518" class="e" marker-end="url(#a)"/>
  <path d="M460 332 H518" class="e" marker-end="url(#a)"/>
  <!-- backend -> services -->
  <path d="M800 128 H858" stroke="#76B900" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M800 204 H858" class="e" marker-end="url(#a)"/>
  <path d="M800 276 H858" class="e" marker-end="url(#a)"/>
  <path d="M800 348 H858" class="e" marker-end="url(#a)"/>

  <text x="40" y="420" class="s">Memora finds passages; Pingie decides what to say; Nemotron writes the words. Memora never writes answers.</text>
</svg>
