<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How an answer is made: question, rewrite, search, relevance check, Nemotron writes a cited answer, citation check, answer or fallback">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8AA0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .s { font-size: 12px; fill: #A0A0B4; }
    .n { font-size: 11px; font-weight: 700; fill: #A78BFA; letter-spacing: 1px; }
    .l { font-size: 12px; font-weight: 600; }
    .box { fill: #15151F; stroke: #2E2E40; }
    .acc { fill: #1C1433; stroke: #7C3AED; }
  </style>

  <rect width="1200" height="400" rx="20" fill="#0B0B12"/>
  <text x="40" y="44" font-size="13" font-weight="600" letter-spacing="2.5" fill="#A78BFA">HOW AN ANSWER IS MADE</text>

  <!-- Row: steps -->
  <g transform="translate(40 80)">
    <rect width="170" height="84" rx="10" class="box"/>
    <text x="16" y="26" class="n">01</text>
    <text x="16" y="50" class="t">Visitor asks</text>
    <text x="16" y="70" class="s">in the chat widget</text>
  </g>
  <g transform="translate(250 80)">
    <rect width="170" height="84" rx="10" class="box"/>
    <text x="16" y="26" class="n">02</text>
    <text x="16" y="50" class="t">Understand</text>
    <text x="16" y="70" class="s">rewrite follow-ups</text>
  </g>
  <g transform="translate(460 80)">
    <rect width="170" height="84" rx="10" class="box"/>
    <text x="16" y="26" class="n">03</text>
    <text x="16" y="50" class="t">Search</text>
    <text x="16" y="70" class="s">top passages in Memora</text>
  </g>
  <!-- decision 1 -->
  <g transform="translate(670 80)">
    <rect width="170" height="84" rx="10" fill="#15151F" stroke="#F59E0B" stroke-dasharray="5 4"/>
    <text x="16" y="26" class="n" style="fill:#F59E0B">CHECK</text>
    <text x="16" y="50" class="t">Strong enough?</text>
    <text x="16" y="70" class="s">weak passages dropped</text>
  </g>
  <g transform="translate(880 80)">
    <rect width="280" height="84" rx="10" class="acc"/>
    <text x="16" y="26" class="n">04 · NEMOTRON ON NEBIUS</text>
    <text x="16" y="50" class="t">Writes a short, cited reply</text>
    <text x="16" y="70" class="s">cites [1] [2], or replies NO_ANSWER</text>
  </g>

  <path d="M210 122 H248" stroke="#8A8AA0" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M420 122 H458" stroke="#8A8AA0" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M630 122 H668" stroke="#8A8AA0" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M840 122 H878" stroke="#34D399" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="859" y="112" text-anchor="middle" class="l" fill="#34D399">yes</text>

  <!-- Outcomes -->
  <g transform="translate(880 250)">
    <rect width="280" height="96" rx="10" fill="#0F1F1A" stroke="#34D399"/>
    <text x="16" y="28" class="n" style="fill:#34D399">ANSWERED</text>
    <text x="16" y="54" class="t">Answer + source chips</text>
    <text x="16" y="76" class="s">only the passages it actually cited</text>
  </g>
  <g transform="translate(460 250)">
    <rect width="380" height="96" rx="10" fill="#22190A" stroke="#F59E0B"/>
    <text x="16" y="28" class="n" style="fill:#F59E0B">FALLBACK</text>
    <text x="16" y="54" class="t">“I don’t have that information.”</text>
    <text x="16" y="76" class="s">offers a person, or takes the visitor’s email as a lead</text>
  </g>

  <path d="M1020 164 V248" stroke="#34D399" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="1030" y="212" class="l" fill="#34D399">cited</text>
  <path d="M755 164 V248" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="765" y="212" class="l" fill="#F59E0B">no</text>
  <path d="M940 164 V200 H800 V248" stroke="#F59E0B" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
  <text x="870" y="194" text-anchor="middle" class="l" fill="#F59E0B">NO_ANSWER</text>

  <!-- Legend -->
  <g transform="translate(40 250)">
    <rect width="380" height="96" rx="10" fill="none" stroke="#2E2E40" stroke-dasharray="3 4"/>
    <text x="16" y="28" class="n">EVERY REPLY IS LABELLED</text>
    <text x="16" y="54" class="s">answered · partial · fallback</text>
    <text x="16" y="76" class="s">smalltalk · lead · offline</text>
  </g>
</svg>
